server:
  port: ${PORT:4001}
  error:
    include-message: always
    include-stacktrace: never

spring:
  application:
    name: litellm-kotlin-backend
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        globally_quoted_identifiers: true
        physical_naming_strategy: ai.litellm.backend.config.PreservingPhysicalNamingStrategy
  jackson:
    serialization:
      write-dates-as-timestamps: false

litellm:
  master-key: ${LITELLM_MASTER_KEY:${MASTER_KEY:}}
  database-url: ${DATABASE_URL:postgresql://litellm:litellm@localhost:5435/litellm}
  config-yaml-path: ${CONFIG_YAML_PATH:config.yaml}
  ui-username: ${UI_USERNAME:}
  ui-password: ${UI_PASSWORD:}
  ui-session-duration: ${LITELLM_UI_SESSION_DURATION:24h}
  key-length: ${LENGTH_OF_LITELLM_GENERATED_KEY:16}

logging:
  level:
    root: INFO
    ai.litellm.backend: DEBUG
