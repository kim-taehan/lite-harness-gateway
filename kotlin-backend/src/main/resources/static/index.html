
    <!DOCTYPE html>
    <html>
    <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="/swagger/swagger-ui.css">
    <link rel="shortcut icon" href="/swagger/favicon.png">
    <title>LiteLLM API - Swagger UI</title>
    </head>
    <body>
    <div id="swagger-ui">
    </div>
    <script src="/swagger/swagger-ui-bundle.js"></script>
    <!-- `SwaggerUIBundle` is now available on the page -->
    <script>
    const TAG_TO_PREFIX = {};const warmedTags = new Set();const LAZY_TAGS = new Set(Object.keys(TAG_TO_PREFIX));const hideStubRows = () => {document.querySelectorAll('.opblock').forEach(op => {const d = op.querySelector('.opblock-summary-description');if (d && LAZY_TAGS.has(d.textContent.trim())) op.style.display = 'none';});};const annotateLazyHeaders = () => {document.querySelectorAll('.opblock-tag').forEach(tagEl => {const m = (tagEl.id || '').match(/^operations-tag-(.+)$/);if (!m || !LAZY_TAGS.has(m[1])) return;const existing = tagEl.querySelector('.lazy-load-hint');if (warmedTags.has(m[1])) { if (existing) existing.remove(); return; }if (existing) return;const hint = document.createElement('small');hint.className = 'lazy-load-hint';hint.textContent = ' (expand to load routes)';hint.style.opacity = '0.6';hint.style.marginLeft = '6px';const target = tagEl.querySelector('a span') || tagEl.querySelector('span') || tagEl;target.appendChild(hint);});};setInterval(() => { hideStubRows(); annotateLazyHeaders(); }, 200);const LazyLoadPlugin = () => ({afterLoad:function(system){setTimeout(()=>{for(const tag of LAZY_TAGS)system.layoutActions.show(['operations-tag',tag],false);},200);},statePlugins:{layout:{wrapActions:{show:(ori,sys)=>(...args)=>{const thing=args[0];const shown=args[1];let tag=null;if(Array.isArray(thing)){for(const t of thing)if(TAG_TO_PREFIX[t])tag=t;}if(shown!==false&&tag&&!warmedTags.has(tag)){warmedTags.add(tag);fetch('/lazy/warm/'+tag,{method:'POST',credentials:'include'}).then(r=>r.json()).then(d=>{if(!d.paths||Object.keys(d.paths).length===0)return;const cur=sys.specSelectors.specJson().toJS();const merged={};let inserted=false;for(const k in (cur.paths||{})){if(k===d.stub_path){for(const nk in d.paths)merged[nk]=d.paths[nk];inserted=true;}else{merged[k]=cur.paths[k];}}if(!inserted)Object.assign(merged,d.paths);cur.paths=merged;cur.components=cur.components||{};cur.components.schemas=Object.assign(cur.components.schemas||{},(d.components||{}).schemas||{});sys.specActions.updateSpec(JSON.stringify(cur));}).catch(()=>{});}return ori(...args);}}}}});const ui = SwaggerUIBundle({plugins:[LazyLoadPlugin],tagsSorter:"alpha",
        url: '/openapi.json',
    "dom_id": "#swagger-ui",
"layout": "BaseLayout",
"deepLinking": true,
"showExtensions": true,
"showCommonExtensions": true,
oauth2RedirectUrl: window.location.origin + '/docs/oauth2-redirect',
    presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
    })
    </script>
    </body>
    </html>
